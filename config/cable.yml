development:
  adapter: async

test:
  adapter: test

# The app has no channels and no Turbo Stream broadcasts — verdict cards are rendered
# as turbo_stream *responses* to the form POST (SPEC §2), not pushed over a socket. So
# there is no Redis accessory on the box; async keeps this in-process and dependency-free.
# Switch to redis/solid_cable if broadcasting is ever added.
production:
  adapter: async
